# =============================================================================
# md2pdf — Docker Compose (VPS deployment)
# =============================================================================
#
# Usage:
#   docker compose up -d --build        # Build and start
#   docker compose logs -f md2pdf       # Follow logs
#   docker compose down                 # Stop everything
#
# To use with Traefik, uncomment the labels below and set your domain.
# To use with Caddy, see the commented caddy block.
# =============================================================================

services:
  md2pdf:
    image: ghcr.io/cairoramos7/md2pdf:latest
    container_name: md2pdf
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    # Resource limits — Chromium can be memory-hungry
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"
    # Intermediate PDF temp files — use tmpfs for performance
    tmpfs:
      - /tmp:size=256M

    # -------------------------------------------------------------------------
    # Traefik reverse proxy configuration
    # -------------------------------------------------------------------------
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.md2pdf.rule=Host(`md2pdf.13.140.156.100.nip.io`)"
      - "traefik.http.routers.md2pdf.entrypoints=https"
      - "traefik.http.routers.md2pdf.tls=true"
      - "traefik.http.routers.md2pdf.tls.certresolver=letsencrypt"
      - "traefik.http.services.md2pdf.loadbalancer.server.port=8050"
    networks:
      - maze-network

networks:
  maze-network:
    name: mazedelivery_maze-network
    external: true
